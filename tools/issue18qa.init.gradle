// Opt-in package isolation for Issue #18 device tests. No signing or permissions changes.
gradle.beforeProject { p ->
    if (p.path != ':app') return
    // Set this before AGP creates output providers; later changes leave APKs in the normal build directory.
    p.layout.buildDirectory.set(new File(p.projectDir, 'build/issue18qa'))
    p.pluginManager.withPlugin('com.android.application') {
        p.extensions.getByName('android').buildTypes.named('debug') {
            applicationIdSuffix = '.issue18qa'
            versionNameSuffix = '-issue18qa'
        }
        p.extensions.getByName('android').sourceSets.getByName('debug').manifest.srcFile(
            new File(p.rootDir, 'tools/issue18qa/AndroidManifest.xml')
        )
    }
}
